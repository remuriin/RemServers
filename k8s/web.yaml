# The portal's web app: "keep one pod of its image running", and a fixed address for that pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: rem-servers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          # ":main" is the newest build of the main branch
          image: ghcr.io/remuriin/remservers-web:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          # traffic is only sent to the pod once this answers
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          # requests: what it is promised. limits: the ceiling it can never go over.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
# The address is chosen by hand so the VPS's nginx can be pointed at it once and for all.
# It exists only inside the VPS. One per service, counting up: 10.43.0.80 is Rem RaaS's web app.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: rem-servers
spec:
  type: ClusterIP
  clusterIP: 10.43.0.81
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080

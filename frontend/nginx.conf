# The web server inside the web app's container. It only serves the built files.
# /api is not here: the VPS's nginx, which sits in front, sends that to the backend's pod.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # a hashed file's name changes whenever its content does, so it can be kept for a year;
    # a missing one is a real 404, never the app's page.
    # No "always": the year applies to files that exist, not to a 404.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html names the hashed files, so it is never cached.
    # A real file is sent as is; any other address is one of the app's own pages.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # for Kubernetes to ask "are you up?", without filling the log
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}

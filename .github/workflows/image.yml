# On a push to main: build the portal's two container images and push them to ghcr.io.
# Flux, in the cluster, sees the new main-<commit>-<commit time> tag and deploys it (repo Fleet).
# The VPS never builds anything, and nothing here logs in to it.
name: image

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/image.yml'
  # also a "Run workflow" button on the Actions page
  workflow_dispatch:

# only pushes to this repository run it; a pull request from a fork never does
permissions:
  contents: read
  packages: write

# two pushes in a row build one after the other, never at once
concurrency: image

jobs:
  build:
    # an ARM machine, the same kind of CPU as the VPS: the backend's bcrypt has compiled code
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # the commit's own time, for the tag Flux sorts by: re-running an old run never sorts above a newer build
      - name: commit time
        id: ts
        run: echo "ts=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: web app
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/arm64
          push: true
          # one tag that names this exact commit, "main" that always points at the newest,
          # and main-<commit>-<commit time>, the one Flux picks the newest build by
          tags: |
            ghcr.io/remuriin/remservers-web:${{ github.sha }}
            ghcr.io/remuriin/remservers-web:main
            ghcr.io/remuriin/remservers-web:main-${{ github.sha }}-${{ steps.ts.outputs.ts }}
          # a repository variable (a public address, not a secret)
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          labels: |
            org.opencontainers.image.source=https://github.com/remuriin/RemServers

      # "tsc" runs inside this build, so a type error in the backend stops the workflow here
      - name: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/remuriin/remservers-api:${{ github.sha }}
            ghcr.io/remuriin/remservers-api:main
            ghcr.io/remuriin/remservers-api:main-${{ github.sha }}-${{ steps.ts.outputs.ts }}
          labels: |
            org.opencontainers.image.source=https://github.com/remuriin/RemServers
